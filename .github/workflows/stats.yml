name: refresh stats

# Deliberately no `push` trigger: this job commits the stat graphics, and a
# push trigger would make it re-run on its own commit.
on:
  schedule:
    - cron: "17 */4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-stats
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Draw the stat graphics
        env:
          # The default token is repository-scoped; contributionsCollection is
          # user data. If it ever comes back empty, add a classic PAT with
          # read:user as a STATS_TOKEN secret and this picks it up.
          GITHUB_TOKEN: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}
          GH_LOGIN: ${{ github.repository_owner }}
        run: python3 scripts/generate_stats.py

      - name: Commit whatever changed
        run: |
          FILES="assets/stats.svg assets/streak.svg assets/langs.svg \
                 assets/year.svg assets/hd-*.svg"
          if [ -z "$(git status --porcelain -- $FILES)" ]; then
            echo "no change"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- $FILES
          git commit -m "stats: refresh profile graphics"
          git push
