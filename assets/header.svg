<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Arqam Ahmad Siddiqui — Founder and CEO at Revzion, Cross-Platform Systems Architect">
  <title>Arqam Ahmad Siddiqui — Founder and CEO at Revzion</title>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0A1017"/>
      <stop offset="45%" stop-color="#102636"/>
      <stop offset="100%" stop-color="#0A1017"/>
    </linearGradient>

    <radialGradient id="glow" cx="50%" cy="42%" r="62%">
      <stop offset="0%" stop-color="#2C9EF7" stop-opacity="0.30"/>
      <stop offset="55%" stop-color="#2C9EF7" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#2C9EF7" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2C9EF7" stop-opacity="0"/>
      <stop offset="50%" stop-color="#2C9EF7" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#2C9EF7" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2C9EF7" stop-opacity="0"/>
      <stop offset="35%" stop-color="#2C9EF7" stop-opacity="0.7"/>
      <stop offset="65%" stop-color="#7FD1FF" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#2C9EF7" stop-opacity="0"/>
    </linearGradient>

    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0 L0 0 0 34" fill="none" stroke="#5AA9E6" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect width="1200" height="300" fill="url(#grid)"/>
  <rect width="1200" height="300" fill="url(#glow)"/>

  <g fill="none" stroke="#2C9EF7" stroke-opacity="0.16" stroke-width="1.25">
    <path d="M0 236 C 200 208, 380 262, 600 232 S 1000 200, 1200 226"/>
    <path d="M0 258 C 220 232, 400 284, 610 254 S 1010 224, 1200 248"/>
  </g>

  <g stroke="#2C9EF7" stroke-opacity="0.55" stroke-width="1.5" fill="none" stroke-linecap="square">
    <path d="M40 40 L40 74 M40 40 L74 40"/>
    <path d="M1160 40 L1160 74 M1160 40 L1126 40"/>
    <path d="M40 260 L40 226 M40 260 L74 260"/>
    <path d="M1160 260 L1160 226 M1160 260 L1126 260"/>
  </g>

  <text x="600" y="112" text-anchor="middle" textLength="760" lengthAdjust="spacingAndGlyphs"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="52" font-weight="700" fill="#FFFFFF">ARQAM AHMAD SIDDIQUI</text>

  <rect x="450" y="136" width="300" height="2" fill="url(#rule)"/>

  <text x="600" y="176" text-anchor="middle" textLength="404" lengthAdjust="spacingAndGlyphs"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="20" font-weight="600" fill="#7FD1FF">FOUNDER &amp; CEO AT REVZION</text>

  <text x="600" y="209" text-anchor="middle" textLength="286" lengthAdjust="spacingAndGlyphs"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="17" font-weight="400" fill="#B9CCDA">Cross-Platform Systems Architect</text>

  <text x="600" y="253" text-anchor="middle" textLength="470" lengthAdjust="spacingAndGlyphs"
        font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace"
        font-size="14" font-weight="500" fill="#5E7F95">KOTLIN MULTIPLATFORM &#183; COMPOSE &#183; KTOR &#183; CLOUD</text>

  <rect x="0" y="296" width="1200" height="4" fill="url(#edge)"/>
</svg>
